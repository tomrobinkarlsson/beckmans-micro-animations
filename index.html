<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beckmans Button Micro Animations</title>
    <meta
      name="description"
      content="Beckmans button hover prototypes with masked square-to-pill micro animations."
    />
    <meta property="og:title" content="Beckmans Button Micro Animations" />
    <meta
      property="og:description"
      content="Interactive primary and secondary button prototypes with square-to-pill hover animations."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://tomrobinkarlsson.github.io/beckmans-micro-animations/"
    />
    <meta
      property="og:image"
      content="https://tomrobinkarlsson.github.io/beckmans-micro-animations/assets/media/preview.png"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./assets/vendor/gsap.min.js"></script>
    <script defer src="./script.js"></script>
  </head>
  <body>
    <main class="canvas" aria-label="Beckmans button hover prototypes">
      <div class="button-row">
        <button class="micro-button micro-button--primary" type="button" aria-label="Primary">
          <span class="micro-button__text">Primary</span>
          <span class="micro-button__text micro-button__text--hover" aria-hidden="true">
            Primary
          </span>
        </button>

        <button class="micro-button micro-button--secondary" type="button" aria-label="Secondary">
          <span class="micro-button__text">Secondary</span>
          <span class="micro-button__text micro-button__text--hover" aria-hidden="true">
            Secondary
          </span>
        </button>
      </div>
    </main>
  </body>
</html>
